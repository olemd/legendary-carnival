<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}lanwatch{% endblock %}</title>
<style>
:root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --line:#e3e3e3; --card:#f7f7f7; --link:#0b57d0;
  --critical:#b3261e; --high:#d9480f; --medium:#b8860b; --low:#2f6f9f; --info:#6b7280; --ok:#2e7d32; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#121417; --fg:#e6e6e6; --muted:#9aa0a6; --line:#2a2e33; --card:#1b1f24; --link:#8ab4f8;
    --critical:#f28b82; --high:#f5a26b; --medium:#e3c15b; --low:#7fb3e0; --info:#9aa0a6; --ok:#81c995; }
}
* { box-sizing:border-box }
body { margin:0; font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg) }
header { display:flex; gap:1.2rem; align-items:baseline; padding:.8rem 1.2rem; border-bottom:1px solid var(--line) }
header .brand { font-weight:700; letter-spacing:.02em }
header nav a { margin-right:1rem; color:var(--link); text-decoration:none }
header nav a.active { font-weight:600; text-decoration:underline }
header .ver { margin-left:auto; color:var(--muted); font-size:.85em }
main { padding:1.2rem; max-width:1400px }
h1 { font-size:1.4rem; margin:.2rem 0 1rem } h2 { font-size:1.1rem; margin:1.4rem 0 .6rem }
table { border-collapse:collapse; width:100%; font-size:.93em }
th, td { text-align:left; padding:.4rem .6rem; border-bottom:1px solid var(--line); vertical-align:top }
th { color:var(--muted); font-weight:600; white-space:nowrap }
tr:hover td { background:var(--card) }
a { color:var(--link) }
code, .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.9em }
.muted { color:var(--muted) }
.cards { display:flex; flex-wrap:wrap; gap:.8rem; margin-bottom:1rem }
.card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:.7rem 1rem; min-width:150px }
.card .n { font-size:1.6rem; font-weight:700 } .card .l { color:var(--muted); font-size:.85em }
.sev { display:inline-block; padding:.05rem .5rem; border-radius:999px; font-size:.8em; font-weight:600; color:#fff; text-transform:uppercase }
.sev-critical{background:var(--critical)} .sev-high{background:var(--high)} .sev-medium{background:var(--medium)}
.sev-low{background:var(--low)} .sev-info{background:var(--info)}
.dot { display:inline-block; width:.6em; height:.6em; border-radius:50%; background:var(--muted); margin-right:.3em }
.dot.on { background:var(--ok) }
form.inline { display:inline } button { font:inherit; padding:.2rem .6rem; cursor:pointer }
input[type=text] { font:inherit; padding:.25rem .5rem }
pre { background:var(--card); border:1px solid var(--line); padding:1rem; overflow:auto; font-size:.85em }
details > summary { cursor:pointer; color:var(--muted) }
.digest { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:.8rem 1rem; margin-bottom:1rem }
.digest .day { color:var(--muted); font-size:.85em }
.kind { display:inline-block; padding:.05rem .45rem; border:1px solid var(--line); border-radius:4px; font-size:.8em; color:var(--muted) }
.md h1, .md h2 { font-size:1.05rem; margin:1rem 0 .4rem } .md p { margin:.4rem 0 } .md ul { margin:.3rem 0 .3rem 1.2rem }
.tabs a { margin-right:.8rem }
</style>
</head>
<body>
<header>
  <span class="brand">lanwatch</span>
  <nav>
    <a href="/" class="{{ 'active' if active == 'dashboard' }}">Dashboard</a>
    <a href="/devices" class="{{ 'active' if active == 'devices' }}">Devices</a>
    <a href="/findings" class="{{ 'active' if active == 'findings' }}">Findings</a>
    <a href="/infra" class="{{ 'active' if active == 'infra' }}">Infra</a>
    <a href="/overview" class="{{ 'active' if active == 'overview' }}">Overview</a>
    <a href="/digest" class="{{ 'active' if active == 'digest' }}">Digest</a>
    <a href="/notifications" class="{{ 'active' if active == 'notifications' }}">Notifications</a>
  </nav>
  <span class="ver">v{{ version }}</span>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
