# lanwatch configuration. Every key is optional; these are the defaults.
# Lookup order: --config, $LANWATCH_CONFIG, ~/.config/lanwatch/config.toml, /etc/lanwatch/config.toml
# Any key can also be set via env: LANWATCH_<SECTION>__<KEY>, e.g. LANWATCH_SCAN__PROFILE=normal

# data_dir = "/var/lib/lanwatch"       # root: /var/lib/lanwatch, otherwise ~/.local/share/lanwatch

[network]
subnets = "auto"                        # or ["192.168.1.0/24", "10.0.0.0/24"]
max_auto_prefix = 22                    # auto-detected subnets wider than this are skipped
exclude_hosts = []                      # IPs or MACs never recorded
exclude_interfaces = ["lo", "docker*", "veth*", "br-*", "virbr*", "tun*", "tap*", "wg*", "tailscale*"]

[scan]
profile = "gentle"                      # gentle | normal | thorough
max_parallel_hosts = 4
rate_limit_pps = 100
discovery_backend = "auto"              # auto | arp-scan | nmap | ping
resolve_hostnames = true
light_top_ports = 200                   # hourly and new-device scans
deep_udp_top_ports = 50                 # weekly deep scan, needs root/CAP_NET_RAW; 0 disables
exclude_ports = [9100]                  # never probed
version_detection = true
scripts = ["ssl-cert", "ssh2-enum-algos", "smb-protocols", "vnc-info", "http-title"]
scan_new_devices_immediately = true
# helper_socket = "/run/lanwatch/helper.sock"   # rootless container: forward to lanwatch-helper
# Infra probes, every schedule.infra_interval_s: DHCP servers + mDNS (nmap broadcast
# scripts, need root/CAP_NET_RAW/helper), UPnP incl. router port mappings, IPv6 exposure.
upnp = true
ipv6 = true
ipv6_top_ports = 100
# The only feature that talks to the internet: nmap's vulners script matches reported
# versions against vulners.com. Off by default. Version matching ignores distro backports.
vulners = false
vulners_min_cvss = 7.0

[schedule]
discovery_interval_s = 300
inventory_interval_s = 3600
deep_interval_s = 604800
infra_interval_s = 900
digest_time = "07:00"

[llm]
enabled = true
base_url = "http://localhost:11434"     # Ollama; may be another machine on the LAN
model = "qwen3.8:27b"                   # or gemma4:26b; compare with `lanwatch llm eval --model ...`
timeout_s = 120
temperature = 0.1
num_ctx = 8192
language = "nb"                         # explanations, digest, suggestions
max_calls_per_round = 25                # the rest is picked up next round
keep_alive = "30m"

[store]
# path = "/var/lib/lanwatch/lanwatch.db"

[overview]
enabled = true
# path = "/var/lib/lanwatch/overview/overview.md"
git = false                             # commit each overview change in its directory

[notify]
log = true
# report_dir = "/var/lib/lanwatch/reports"
min_severity = "medium"                 # push findings at or above this; channels may raise it
resolved = false                        # also push when findings auto-resolve
digest = true                           # push the daily digest
# Findings from one round are batched into one message. Test with: lanwatch notify --test
# Secrets can live in env instead: LANWATCH_NOTIFY__NTFY__TOKEN=...

[notify.ntfy]
enabled = false
url = "https://ntfy.sh"                 # or your own ntfy server
topic = ""                              # required when enabled
# token = ""                            # access token for protected topics
# min_severity = "high"

[notify.webhook]
enabled = false
url = ""                                # POST JSON {event, title, text, severity, ts, findings[]}
headers = {}                            # e.g. { Authorization = "Bearer ..." }

[notify.home_assistant]
enabled = false
url = "http://homeassistant.local:8123"
token = ""                              # long-lived access token, required when enabled
service = "notify.notify"               # e.g. notify.mobile_app_my_phone
publish_sensors = true                  # sensor.lanwatch_devices_online, _devices_known, _open_findings

[notify.email]
enabled = false
smtp_host = "localhost"
smtp_port = 587
starttls = true
# username = ""
# password = ""
sender = "lanwatch@localhost"
to = []                                 # required when enabled

[web]
enabled = true
host = "127.0.0.1"                      # anything else requires password
port = 8321
# password = "change-me"                # HTTP basic auth, user "lanwatch"

[rules]
# "inventory.ip-changed" = { enabled = false }
# "inventory.new-device" = { severity = "high" }
# "service.database-exposed" = { severity = "info" }
