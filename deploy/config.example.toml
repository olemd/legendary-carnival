# lanwatch configuration. Every key is optional; these are the defaults.
# Lookup order: --config, $LANWATCH_CONFIG, ~/.config/lanwatch/config.toml, /etc/lanwatch/config.toml
# Any key can also be set via env: LANWATCH_<SECTION>__<KEY>, e.g. LANWATCH_SCAN__PROFILE=normal

# data_dir = "/var/lib/lanwatch"       # root: /var/lib/lanwatch, otherwise ~/.local/share/lanwatch

[network]
subnets = "auto"                        # or ["192.168.1.0/24", "10.0.0.0/24"]
max_auto_prefix = 22                    # auto-detected subnets wider than this are skipped
exclude_hosts = []                      # IPs or MACs never recorded
watch_offline_rounds = 2                # a watched device is "offline" after this many missed rounds
exclude_interfaces = ["lo", "docker*", "veth*", "br-*", "virbr*", "tun*", "tap*", "wg*", "tailscale*"]

[scan]
profile = "gentle"                      # gentle | normal | thorough
max_parallel_hosts = 4
rate_limit_pps = 100
discovery_backend = "auto"              # auto | arp-scan | nmap | ping
resolve_hostnames = true                # names from reverse DNS or /etc/hosts, after any backend
light_top_ports = 200                   # hourly and new-device scans
deep_udp_top_ports = 50                 # weekly deep scan, needs root/CAP_NET_RAW; 0 disables
exclude_ports = [9100]                  # never probed
skip_hosts = []                         # IPs or MACs tracked but never port-scanned (gear that crashes under nmap)
version_detection = true
scripts = ["ssl-cert", "ssh2-enum-algos", "smb-protocols", "vnc-info", "http-title"]
scan_new_devices_immediately = true
recheck_silent = true                   # slower ping for devices that missed the scan (sleepy Wi-Fi); only a reply counts
# helper_socket = "/run/lanwatch/helper.sock"   # rootless container: forward to lanwatch-helper
# Infra probes, every schedule.infra_interval_s: DHCP servers + mDNS (nmap broadcast
# scripts, need root/CAP_NET_RAW/helper), UPnP incl. router port mappings, IPv6 exposure.
upnp = true
dns_filter_check = false                # does the DHCP-announced resolver filter ads/malware? sends test lookups out
arp_watch = true                        # listen to ARP between scans: spoofing, network sweeps
name_poisoning_check = true             # ask for a name that does not exist; whoever answers is poisoning
ipv6 = true
ipv6_top_ports = 100
# The only feature that talks to the internet: nmap's vulners script matches reported
# versions against vulners.com. Off by default. Version matching ignores distro backports.
vulners = false
vulners_min_cvss = 7.0

[schedule]
discovery_interval_s = 300
inventory_interval_s = 3600
deep_interval_s = 604800
infra_interval_s = 900
digest_time = "07:00"

[llm]
enabled = true
backend = "ollama"                      # or "koboldcpp"
base_url = "http://localhost:11434"     # KoboldCpp: port 5001. May be another machine on the LAN
model = "qwen3.8:27b"                   # or gemma4:26b; compare with `lanwatch llm eval --model ...`
timeout_s = 120
temperature = 0.1
num_ctx = 8192
language = "nb"                         # explanations, digest, suggestions
max_calls_per_round = 25                # the rest is picked up next round
keep_alive = "30m"
# With backend = "koboldcpp": model is only a label (KoboldCpp serves the one model it was
# started with), and num_ctx, chat_num_ctx and keep_alive are ignored (set --contextsize).

# Optional second server, used when the one above cannot be reached or has no model.
# [llm.fallback]
# backend = "ollama"
# base_url = "http://localhost:11434"
# model = "qwen3.8:27b"

[store]
# path = "/var/lib/lanwatch/lanwatch.db"
# Days of history kept by the daily maintenance job; 0 keeps everything. Devices, services
# and findings are never pruned.
keep_rounds_days = 30                   # who answered in each discovery round
keep_events_days = 365                  # the timeline
keep_notifications_days = 90            # the notification log

[overview]
enabled = true
# path = "/var/lib/lanwatch/overview/overview.md"
git = false                             # commit each overview change in its directory

[notify]
log = true
# report_dir = "/var/lib/lanwatch/reports"
min_severity = "medium"                 # push findings at or above this; channels may raise it
resolved = false                        # also push when findings auto-resolve
digest = true                           # push the daily digest
# Findings from one round are batched into one message. Test with: lanwatch notify --test
# Secrets can live in env instead: LANWATCH_NOTIFY__NTFY__TOKEN=...

[notify.ntfy]
enabled = false
url = "https://ntfy.sh"                 # or your own ntfy server
topic = ""                              # required when enabled
# token = ""                            # access token for protected topics
# min_severity = "high"

[notify.webhook]
enabled = false
url = ""                                # POST JSON {event, title, text, severity, ts, findings[]}
headers = {}                            # e.g. { Authorization = "Bearer ..." }

[notify.home_assistant]
enabled = false
url = "http://homeassistant.local:8123"
token = ""                              # long-lived access token, required when enabled
service = "notify.notify"               # e.g. notify.mobile_app_my_phone
publish_sensors = true                  # sensor.lanwatch_devices_online, _devices_known, _open_findings
# lanwatch_url = "http://192.168.1.10:8321"  # tapping a notification opens lanwatch; adds buttons
                                        # (see docs/home-assistant.md)

[notify.email]
enabled = false
smtp_host = "localhost"
smtp_port = 587
starttls = true
# username = ""
# password = ""
sender = "lanwatch@localhost"
to = []                                 # required when enabled

[web]
enabled = true
host = "127.0.0.1"                      # anything else requires password
port = 8321
# password = "change-me"                # HTTP basic auth, user "lanwatch"

[decoy]
# Listeners on ports this machine does not use. Anything that connects is scanning the
# network; it becomes a finding. A port already in use when lanwatch starts is skipped,
# and so is one it may not bind (below 1024 without CAP_NET_BIND_SERVICE). A port listed
# here is taken: remove it before installing a real service on it.
enabled = true
ports = [23, 1433, 3389, 5555]         # telnet, MS SQL, RDP, Android debug bridge
ignore = []                            # source addresses never reported

[firmware]
# Once a day: which version do devices run, and is a newer one out? Covers Home Assistant,
# ESPHome, Shelly, Tasmota, Pi-hole and Jellyfin. Reading the running version stays on the
# LAN. Shelly and Pi-hole say themselves whether an update exists; for the others the
# latest release is looked up at the vendor or on GitHub (public version lists, nothing about
# your devices is sent). online = false keeps everything on the LAN.
enabled = true
online = true                           # ask vendors/GitHub for the latest release

[exposure]
# Once a day: what does the internet see of this network? The public address is looked up in
# Shodan's InternetDB (free, no key), which scans the whole internet: ports that answer from
# outside, host names, and services matched to published vulnerabilities. Off by default
# because it tells a third party the network's public address; everything else stays local.
enabled = false
# ip_lookup_url = "https://api.ipify.org"   # asked when no UPnP gateway reports the address

[airos]
# Read-only link to Ubiquiti airMAX radios (airOS 6 and 8, e.g. NanoStation, LiteBeam): model,
# firmware, and the radio link each one is part of (signal, noise, CCQ, airMAX quality and
# capacity). Uses the radio's read-only web account (System -> Read-Only Account), never the
# administrator. One login attempt per round, and none again after a rejected password
# until it changes: airOS locks the account after three failures. The certificate is pinned
# on first contact. Stays on the LAN. See docs/airos.md.
enabled = false
hosts = []                              # e.g. ["192.168.1.20", "192.168.1.21"]
username = ""
password = ""
timeout_s = 8

[unifi]
# Read-only link to a UniFi Network controller (a UniFi OS console or UniFi OS Server,
# Network 9.3+). Per client: wired/wireless, uplink device, guest, controller name,
# network/VLAN; the networks, SSIDs and UniFi devices themselves (state, pending firmware);
# the Topology page; three rules. The key comes from the Network app's Integrations page
# (/network/default/integrations). Stays on the LAN. See docs/unifi.md.
enabled = false
url = "https://192.168.1.1"             # the console; lanwatch appends the API path
api_key = ""
# site = "Home"                         # id or name; default: the first site
verify_tls = true                       # consoles are self-signed: pin with ca_file, or set false
# ca_file = "/etc/lanwatch/unifi.pem"   # the console's certificate (docs/unifi.md shows the export)
adopt_names = true                      # name unnamed devices as the controller names them

[snmp]
# Read-only SNMPv3 links to devices on the LAN: one [snmp.devices.<name>] table each, named
# by you; nothing is read until one is listed. Every device gets what it is and its uptime.
# The one marked router = true also gets its ARP table and (Juniper) its DHCP leases.
# They are never taken as presence: they add addresses to the recheck's slower ping, and a
# router that ties an address to another MAC is a finding. SNMPv3 with authentication and
# encryption only; lanwatch does not speak v1/v2c communities. Each table holds its
# device's whole login: nothing is shared between devices. Create a read-only v3 user on
# each device first: docs/snmp.md has an example for Junos. Stays on the LAN. Needs the
# snmp package (snmpbulkwalk).
#
# [snmp.devices.fw]
# router = true                         # at most one device
# host = "192.168.1.1"                  # required; the router may leave it out: this host's default gateway
# user = "lanwatch"
# auth_protocol = "SHA-256"             # SHA-256, SHA-384, SHA-512, or SHA (SHA-1, e.g. UniFi)
# auth_password = ""                    # at least 8 characters, no spaces
# priv_protocol = "AES"                 # AES (AES-128) or AES-256
# priv_password = ""
# timeout_s = 5
# enabled = true                        # false: keep the table but stop reading the device
#
# [snmp.devices.ups]
# host = "192.168.1.20"
# user = "lanwatch"
# auth_protocol = "SHA"                 # what the device offers; SHA-1 on APC NMC2
# auth_password = ""
# priv_password = ""

[latency]
# A few pings to the gateway every discovery round: round-trip time and loss, with a day's
# trend on the dashboard and a finding when probes are lost three rounds in a row. "gateway"
# means this host's default gateways; add an internet address yourself if you want that
# path measured too, e.g. targets = ["gateway", "1.1.1.1"]. Pings run from the service
# itself (no privilege needed), so internet targets work without changes to the helper.
enabled = true
targets = ["gateway"]
count = 4
loss_threshold = 0.25                   # share of probes lost that counts as a bad round

[snmp_audit]
# Does any device answer SNMP with the well-known defaults? Once per deep scan (weekly)
# and for each new device: one GET of sysDescr over SNMPv1 and v2c with `public` and
# `private`, and whether an SNMPv3 agent answers. Never a SET or a walk, never real
# credentials; the only place lanwatch speaks v1/v2c. scan.skip_hosts are left out.
# A default community that answers is a finding (critical for `private`). docs/snmp.md.
enabled = true

[oui]
# Vendor names for MAC addresses come from the IEEE registry lists arp-scan and nmap ship,
# which age with the package: a device whose prefix was assigned after that shows no vendor.
# The registry is downloaded from standards-oui.ieee.org once a week (a public list, the only
# request this makes). online = false uses the copy installed with nmap instead.
online = true

[rules]
# "inventory.ip-changed" = { enabled = false }
# "inventory.new-device" = { severity = "high" }
# "service.database-exposed" = { severity = "info" }
