# lanwatch configuration (TOML). Every key is optional: with nothing set here, the built-in
# defaults apply and lanwatch scans the directly attached networks.
#
#   All keys and their defaults:  /usr/share/doc/lanwatch/examples/config.example.toml
#   Effective configuration:      sudo lanwatch config show
#   Apply changes:                sudo systemctl restart lanwatch
#
# This file may contain secrets (web password, notification tokens). It is readable only by
# root and the lanwatch service user.

# Web UI. Loopback only by default; binding to anything else requires a password.
# [web]
# host = "0.0.0.0"
# password = "change-me"            # HTTP basic auth, user "lanwatch"

# Local LLM (Ollama) for explanations and the daily digest. lanwatch works without it.
# [llm]
# base_url = "http://localhost:11434"
# enabled = false

# Scanning. The two checks below are off by default because they send something out of
# your network; everything else lanwatch does stays on the LAN.
# [scan]
# dns_filter_check = true           # does the DNS resolver DHCP hands out filter ads/malware?
#                                   # (sends a few test lookups through that resolver)
# vulners = true                    # match service versions against vulners.com

# Firmware check, once a day and with "sudo lanwatch firmware": the version Home Assistant,
# ESPHome, Shelly, Tasmota, Pi-hole and Jellyfin devices report. Reading it stays on the
# LAN. Whether a newer release exists has to be asked of the vendor or GitHub for most of
# them, and that is off until you turn it on here.
# [firmware]
# online = true
# enabled = false                   # no firmware check at all

# Decoy ports: lanwatch listens on ports this machine does not use; a device that connects
# is scanning the network and becomes a finding. A port in use when lanwatch starts is
# skipped (see the Status page). A port listed here is taken, so remove it before
# installing a real service on it.
# [decoy]
# ports = [23, 1433, 3389, 5555]    # telnet, MS SQL, RDP, Android debug bridge
# ignore = ["192.168.1.9"]          # addresses never reported, e.g. your own scanner
# enabled = false
