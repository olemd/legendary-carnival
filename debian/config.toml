# lanwatch configuration (TOML). Every key is optional: with nothing set here, the built-in
# defaults apply and lanwatch scans the directly attached networks.
#
# This file is yours. Upgrades never touch it, and it ships empty so there is nothing to
# merge. Every setting, its default and what it does is in the reference next to it,
# which each upgrade refreshes:
#
#   /etc/lanwatch/config.toml.default   copy the sections you want from here
#   sudo lanwatch config show           effective configuration (secrets shown as ***)
#   sudo systemctl restart lanwatch     apply changes
#
# This file may contain secrets (web password, API keys, notification tokens). It is
# readable only by root and the lanwatch service user.
