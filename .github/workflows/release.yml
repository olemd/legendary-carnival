name: release
# Pushing a tag vX.Y.Z builds the Debian packages for amd64 and arm64, each on its own
# architecture, tests them under systemd, and publishes them as a GitHub release and in
# the apt repository on kode.naiv.no. Nothing is published unless both builds passed.
on:
  push:
    tags: ["v*"]
jobs:
  # The tag must match the version in all three places it is written down.
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches pyproject.toml, lanwatch/__init__.py and debian/changelog
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pyproject=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          module=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/lanwatch/__init__.py)
          changelog=$(dpkg-parsechangelog -S Version)
          echo "tag=$tag pyproject=$pyproject module=$module changelog=$changelog"
          for v in "$pyproject" "$module" "$changelog"; do
            if [ "$v" != "$tag" ]; then
              echo "::error::version mismatch: tag is $tag but found '$v'"
              exit 1
            fi
          done

  # Every supported distribution; day-to-day CI only tests Debian 13.
  amd64:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential debhelper lintian
      - run: make deb
      - run: lintian --fail-on error dist/lanwatch_*_amd64.deb
      - run: PODMAN="sudo podman" tests/deb/e2e.sh docker.io/library/debian:13
      - run: PODMAN="sudo podman" tests/deb/e2e.sh docker.io/library/debian:12
      - run: PODMAN="sudo podman" tests/deb/e2e.sh docker.io/library/ubuntu:24.04
      - uses: actions/upload-artifact@v4
        with:
          name: deb-amd64
          path: dist/lanwatch_*_amd64.deb
          if-no-files-found: error

  # Built and tested natively: the build runs the bundled Python, and the sandboxed
  # services cannot run under emulation.
  arm64:
    needs: version
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential debhelper lintian podman
      - run: make deb
      - run: lintian --fail-on error dist/lanwatch_*_arm64.deb
      - run: PODMAN="sudo podman" tests/deb/e2e.sh docker.io/library/debian:13
      - uses: actions/upload-artifact@v4
        with:
          name: deb-arm64
          path: dist/lanwatch_*_arm64.deb
          if-no-files-found: error

  publish:
    needs: [amd64, arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: deb-*
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/lanwatch_*_amd64.deb dist/lanwatch_*_arm64.deb --verify-tag --generate-notes

  # The same packages go to the apt repository on kode.naiv.no (Forgejo's Debian registry,
  # which signs the index with its own key), so an install gets new releases through apt.
  # A job of its own, so it can be re-run alone when only the upload failed.
  #
  # Needs the repository secret FORGEJO_PACKAGES_TOKEN: an access token of the Forgejo user
  # below with write:package.
  apt:
    needs: [amd64, arm64]
    runs-on: ubuntu-24.04
    env:
      FORGEJO_OWNER: olemd
      REGISTRY: https://kode.naiv.no/api/packages/olemd/debian
      # One suite per distribution the package is tested on above (Debian 12 and 13,
      # Ubuntu 24.04), so a sources file can name the release it runs. The same .deb goes
      # into each.
      SUITES: bookworm trixie noble
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: deb-*
          merge-multiple: true
      - name: Upload to the Debian registry
        env:
          FORGEJO_PACKAGES_TOKEN: ${{ secrets.FORGEJO_PACKAGES_TOKEN }}
        run: |
          if [ -z "$FORGEJO_PACKAGES_TOKEN" ]; then
            echo "::error::the secret FORGEJO_PACKAGES_TOKEN is not set"
            exit 1
          fi
          for suite in $SUITES; do
            for deb in dist/lanwatch_*_amd64.deb dist/lanwatch_*_arm64.deb; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' \
                --user "$FORGEJO_OWNER:$FORGEJO_PACKAGES_TOKEN" --upload-file "$deb" \
                "$REGISTRY/pool/$suite/main/upload")
              # 409: this version and architecture is there already, as on a re-run.
              case "$code" in
                201) echo "$suite: uploaded $deb" ;;
                409) echo "$suite: already in the registry: $deb" ;;
                *) echo "::error::$suite: uploading $deb failed with HTTP $code"; exit 1 ;;
              esac
            done
          done
      # A 409 above is taken on trust, so ask the index apt reads: every suite must list
      # this version for both architectures.
      - name: The release is in every suite's index
        run: |
          version="${GITHUB_REF_NAME#v}"
          for suite in $SUITES; do
            for arch in amd64 arm64; do
              if curl -fsS "$REGISTRY/dists/$suite/main/binary-$arch/Packages" \
                  | grep -A10 -x 'Package: lanwatch' | grep -qxF "Version: $version"; then
                echo "$suite/$arch: lanwatch $version"
              else
                echo "::error::lanwatch $version is not in the $suite index for $arch"
                exit 1
              fi
            done
          done
